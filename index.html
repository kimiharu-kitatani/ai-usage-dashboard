<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI使用量">
<title>AI使用量ダッシュボード</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7; --card: #ffffff; --text: #1b1d22; --muted: #6b7280; --line: #e5e7eb;
    --track: #e9ebef; --ok: #16a34a; --warn: #d97706; --bad: #dc2626; --accent: #2563eb;
    --manual: #7c3aed; --banner: #fff7ed; --banner-text: #9a3412;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318; --card: #1b1e25; --text: #e8eaf0; --muted: #9aa1ae; --line: #2b2f39;
      --track: #2b2f39; --ok: #22c55e; --warn: #f59e0b; --bad: #f87171; --accent: #60a5fa;
      --manual: #a78bfa; --banner: #3a2410; --banner-text: #fdba74;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
    font-size: 13px; line-height: 1.35; -webkit-text-size-adjust: 100%;
    padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
  }
  main { max-width: 920px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 6px; margin: 0 2px 6px; flex-wrap: wrap; }
  h1 { font-size: 15px; margin: 0; }
  .meta { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; }
  button, .btn {
    font: inherit; font-size: 11px; border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 7px; padding: 3px 7px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 3px; white-space: nowrap;
  }
  button:active, .btn:active { opacity: .7; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .stale { background: var(--banner); color: var(--banner-text); border-radius: 6px; padding: 1px 6px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .stale[hidden] { display: none; }
  #cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; min-width: 0; }
  .card-head { display: flex; align-items: baseline; gap: 4px; flex-wrap: wrap; }
  .card h2 { font-size: 14px; margin: 0; white-space: nowrap; }
  .plan { color: var(--muted); font-size: 10px; white-space: nowrap; }
  .row { padding: 5px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row-head { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; }
  .label { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .pct { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pct small { font-size: 11px; font-weight: 600; }
  .na { font-size: 11px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .bar { height: 5px; background: var(--track); border-radius: 999px; overflow: hidden; margin: 2px 0 3px; }
  .bar > span { display: block; height: 100%; width: 0; border-radius: 999px; background: var(--ok); transition: width .4s; }
  .bar.warn > span { background: var(--warn); } .bar.bad > span { background: var(--bad); }
  .batt { position: relative; height: 26px; margin: 4px 7px 3px 0; border: 2px solid var(--muted); border-radius: 6px; padding: 2px; }
  .batt::after { content: ""; position: absolute; right: -7px; top: 50%; transform: translateY(-50%); width: 4px; height: 45%; background: var(--muted); border-radius: 0 3px 3px 0; }
  .batt .fill { height: 100%; width: 0; border-radius: 3px; background: var(--c, var(--track)); transition: width .4s; }
  .batt .bt { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; text-shadow: 0 0 3px var(--card), 0 0 3px var(--card); }
  .batt.na-ring { border-style: dashed; } .batt.na-ring .bt { font-size: 11px; color: var(--muted); }
  @media (min-width: 700px) { .batt { height: 36px; } .batt .bt { font-size: 18px; } }
  .row-head { justify-content: center; } .reset { text-align: center; }
  .reset { font-size: 11px; font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .countdown { font-weight: 600; color: var(--text); white-space: nowrap; }
  .sub { color: var(--muted); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { display: inline-block; font-size: 9px; font-weight: 700; padding: 0 4px; border-radius: 5px; border: 1px solid var(--manual); color: var(--manual); margin-left: 3px; vertical-align: middle; }
  .src { color: var(--muted); font-size: 10px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note { color: var(--warn); font-size: 11px; font-weight: 600; margin-top: 3px; }
  .err { color: var(--bad); font-size: 10px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note:empty, .err:empty, .src:empty, .sub:empty { display: none; }
  .actions { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--text); padding: 12px; width: min(360px, 94vw); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog h3 { font-size: 14px; margin: 0 0 6px; }
  .form { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .form label { font-size: 11px; color: var(--muted); display: grid; gap: 2px; }
  .form label.wide { grid-column: 1 / -1; }
  .form input { font: inherit; font-size: 16px; padding: 5px 7px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); width: 100%; min-width: 0; }
  .hint { font-size: 11px; color: var(--muted); margin: 0 0 6px; }
  dialog .actions button { font-size: 13px; padding: 5px 10px; }
  @media (max-width: 699px) { .reset { white-space: normal; } }
  @media (min-width: 700px) {
    body { font-size: 14px; padding: 12px; }
    h1 { font-size: 17px; } .meta, .stale { font-size: 12px; }
    #cards { gap: 12px; } .card { padding: 12px 14px; }
    .card h2 { font-size: 16px; } .plan { font-size: 12px; }
    .row { padding: 8px 0; } .label { font-size: 13px; } .pct { font-size: 28px; } .pct small { font-size: 13px; }
    .today-n { font-size: 36px; } .today-l { font-size: 12px; }
    .na { font-size: 14px; } .bar { height: 7px; margin: 4px 0 4px; } .reset { font-size: 13px; }
    .sub, .src, .err { font-size: 11px; } .note { font-size: 12px; } button, .btn { font-size: 12px; padding: 4px 9px; }
  }

  .today-block { text-align: center; padding: 4px 0 6px; border-bottom: 1px solid var(--line); margin-bottom: 2px; }
  .today-n { font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .today-n.na { font-size: 18px; color: var(--muted); font-weight: 700; }
  .today-l { font-size: 10px; color: var(--muted); margin-top: 1px; }
  .day-tick { position: absolute; top: 0; bottom: 0; width: 1.5px; background: repeating-linear-gradient(to bottom, rgba(255,255,255,.95) 0 2px, rgba(15,23,42,.65) 2px 4px); opacity: .95; z-index: 1; pointer-events: none; transform: translateX(-50%); }
  .batt .day-tick { top: 0; bottom: 0; width: 2px; background: repeating-linear-gradient(to bottom, rgba(255,255,255,.95) 0 3px, rgba(15,23,42,.65) 3px 6px); }
  .pace-mark { position: absolute; top: -1px; bottom: -1px; width: 2px; background: #facc15; opacity: 1; z-index: 2; pointer-events: none; transform: translateX(-50%); box-shadow: 0 0 0 1px rgba(0,0,0,.35); }
  .batt .pace-mark { top: 0; bottom: 0; }
  /* compact view */
  .ico { width: 16px; height: 16px; flex: none; display: block; }
  #strip { display: inline-flex; max-width: 100%; flex-wrap: wrap; align-items: center; gap: 3px 8px; background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 4px 6px; }
  .mg { display: flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap; }
  .mg.has-today { flex-direction: column; align-items: flex-start; gap: 2px; }
  .mg + .mg { border-left: 1px solid var(--line); padding-left: 8px; }
  .mg-top { display: flex; align-items: center; gap: 4px; }
  .mg-today .today-n { font-size: 18px; }
  .mg-today .today-n.na { font-size: 12px; }
  .mg-today .today-l { font-size: 9px; }
  .mg-bars { display: flex; align-items: center; gap: 3px; }
  .wl { font-size: 10px; color: var(--muted); font-weight: 600; margin-left: 2px; }
  .mb { position: relative; width: 26px; height: 12px; border: 1.5px solid var(--muted); border-radius: 3px; padding: 1px; margin-right: 3px; }
  .mb::after { content: ""; position: absolute; right: -4px; top: 3px; width: 2px; height: 4px; background: var(--muted); border-radius: 0 1px 1px 0; }
  .mb .fill { height: 100%; border-radius: 1px; background: var(--c, var(--track)); }
  .mb.na-ring { border-style: dashed; }
  .mp { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 2.6em; }
  .mp.na { font-size: 9px; color: var(--muted); font-weight: 600; }
  .mmeta { margin-left: auto; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .mmeta .t { font-size: 10px; color: var(--muted); }
  .mmeta button { font-size: 10px; padding: 1px 5px; }
  #det { display: none; width: fit-content; max-width: 100%; margin-top: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 4px 7px; font-size: 11px; line-height: 1.45; }
  body.expanded #det { display: block; }
  .dsv { display: flex; gap: 5px; align-items: flex-start; } .dsv + .dsv { border-top: 1px solid var(--line); margin-top: 3px; padding-top: 3px; }
  .dsv .ico { margin-top: 1px; } .dsv > div { min-width: 0; flex: 1; }
  .dl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .dl .k { color: var(--muted); font-weight: 600; } .dl.sub2 { color: var(--muted); font-size: 10px; }
  .dl .old { color: var(--warn); font-weight: 700; } .dl a, .dl .lnk { color: var(--accent); background: none; border: 0; padding: 0; font-size: 10px; cursor: pointer; text-decoration: underline; }
  #cards, header { display: none; }
  @media (min-width: 700px) and (min-height: 500px) {
    #strip, #det { display: none !important; } #cards { display: grid !important; } header { display: flex !important; }
    h1 { font-size: 17px; }
  }

/* 通常表示: 2列（Claude/Codex）、各列3行（5h/今日/1週）。持越しは数値を維持、塗りは100%上限。 */
body:not(.expanded) #strip{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%;max-width:620px}
body:not(.expanded) #cards,body:not(.expanded) header,body:not(.expanded) #top3{display:none!important}
#top3{display:none;margin:0 0 10px}
body.expanded #top3{display:block}
.top3-box{background:var(--card);border:1.5px solid var(--accent);border-radius:12px;padding:8px 10px}
.top3-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:7px;flex-wrap:wrap}
.top3-title{font-weight:800;font-size:13px;display:inline-flex;align-items:center;gap:5px;color:var(--text)}
.top3-sub{font-size:10.5px;color:var(--muted)}
.top3-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:560px){.top3-grid{grid-template-columns:1fr}}
.top3-card{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 8px;display:flex;flex-direction:column;gap:5px;min-width:0}
.top3-card.rank-1{border-color:#eab308;box-shadow:0 0 0 1px rgba(234,179,8,.25)}
.top3-top{display:flex;align-items:center;gap:5px;min-width:0}
.top3-rank{font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:999px;flex:none;line-height:1.3}
.top3-rank.r1{background:#fef08a;color:#854d0e;border:1px solid #eab308}
.top3-rank.r2{background:#e2e8f0;color:#1e293b;border:1px solid #94a3b8}
.top3-rank.r3{background:#ffedd5;color:#9a3412;border:1px solid #fb923c}
.top3-name{font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;gap:4px;min-width:0;flex:1}
.top3-score{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap;margin-left:auto}
.top3-score small{font-size:10px;font-weight:600;color:var(--muted);margin-right:2px}
.top3-card .mg-bars{display:grid;grid-template-columns:2.2em minmax(24px,1fr) auto;grid-auto-rows:20px;gap:3px 4px;align-items:center}
.top3-card .mb{width:100%;margin:0}
.top3-card .mp{font-size:11px;white-space:nowrap;text-align:right}
.top3-foot{font-size:10px;color:var(--muted);display:flex;justify-content:space-between;align-items:flex-start;gap:4px;font-variant-numeric:tabular-nums;margin-top:auto}
.top3-resets{display:flex;flex-direction:column;align-items:flex-end;gap:2px;white-space:nowrap;line-height:1.25}
.top3-rst{white-space:nowrap}
#strip .mg.has-today{min-width:0;width:100%;align-items:stretch;gap:7px;padding:0;border:0}
#strip .mg-top{min-height:22px;font-weight:700;font-size:13px}
#strip .mg-bars{display:grid;grid-template-columns:2.5em minmax(26px,1fr) minmax(4em,auto);grid-auto-rows:22px;gap:4px;align-items:center}
#strip .mb{width:100%;margin:0}#strip .mp{font-size:11px;white-space:nowrap}.mmeta{grid-column:1/-1;justify-self:end}
.chk-5h{display:inline-flex;align-items:center;gap:3px;font-size:10px;color:var(--text);cursor:pointer;user-select:none;padding:1px 6px;border:1px solid var(--line);border-radius:7px;background:var(--card)}
.chk-5h input{margin:0;cursor:pointer}
/* Antigravity モデル別使用状況（3モデル枠：Gemini Pro / Gemini Flash / Claude Sonnet） */
.agy-strip{grid-column:1/-1;border-top:1px solid var(--line);padding-top:8px;margin-top:2px;display:flex;flex-direction:column;gap:6px;width:100%}
.agy-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;cursor:pointer}
.agy-title{font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.agy-cur{font-size:10px;font-weight:600;padding:1px 6px;border-radius:999px;background:rgba(37,99,235,.12);color:var(--accent);border:1px solid rgba(37,99,235,.28)}
.agy-sum{margin-left:auto;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.agy-models-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
@media (max-width:520px){.agy-models-strip{grid-template-columns:1fr}}
.agy-mcol{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 7px;display:flex;flex-direction:column;gap:4px;min-width:0;cursor:pointer}
.agy-mcol-head{display:flex;align-items:center;justify-content:space-between;gap:4px;font-weight:700;font-size:12px}
.agy-mname{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agy-dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--c,var(--accent))}
.agy-mcol .mg-bars{display:grid;grid-template-columns:2.2em minmax(24px,1fr) auto;grid-auto-rows:20px;gap:3px 4px;align-items:center}
.agy-mcol .mp{font-size:10.5px;white-space:nowrap;text-align:right}
.agy-mcol .mp small{font-size:9.5px;color:var(--muted);font-weight:500;margin-left:2px}
.agy-mcol-sub{font-size:9.5px;color:var(--muted);display:flex;justify-content:space-between;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.agy-cards-wrap{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:699px){.agy-cards-wrap{grid-template-columns:1fr}}


/* ==============================================================
   スマホ向け スワイプ & タブ切り替え UI
   ============================================================== */
.swipe-tabs { display: none; }
.swipe-track { width: 100%; }

@media (min-width: 700px) {
  .swipe-tabs { display: none !important; }
  .swipe-track {
    display: grid !important;
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    gap: 12px !important;
    width: 100% !important;
  }
  #pane-top3 {
    grid-column: 1 / -1 !important;
  }
  #pane-top3 > #top3 { display: block; margin-bottom: 4px; }
  #pane-claude, #pane-codex {
    min-width: 0 !important;
  }
  #pane-antigravity {
    grid-column: 1 / -1 !important;
  }
}

@media (max-width: 699px) {
  html, body {
    overflow-x: hidden !important;
    width: 100% !important;
    max-width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
  }
  main {
    width: 100% !important;
    max-width: 100% !important;
    overflow-x: hidden !important;
  }
  header {
    display: flex !important;
    flex-wrap: wrap !important;
    justify-content: space-between !important;
    align-items: center !important;
    gap: 4px 6px !important;
    padding: 6px 10px !important;
    width: 100% !important;
    box-sizing: border-box !important;
    background: var(--card) !important;
    border-bottom: 1px solid var(--line) !important;
    margin: 0 !important;
  }
  header h1 {
    font-size: 14.5px !important;
    margin: 0 !important;
  }
  header .meta {
    font-size: 10.5px !important;
  }
  header .spacer {
    display: none !important;
  }
  .chk-5h {
    font-size: 9.5px !important;
    padding: 2px 6px !important;
  }
  #htoggle {
    display: none !important;
  }
  .btn, #reload {
    padding: 2px 7px !important;
    font-size: 10.5px !important;
  }

  /* タブバー (Sticky) */
  .swipe-tabs {
    display: flex !important;
    gap: 6px;
    padding: 8px 10px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 100;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .swipe-tabs::-webkit-scrollbar { display: none; }

  .stab {
    flex: 1 0 auto;
    padding: 6px 13px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s ease;
    text-align: center;
  }
  .stab.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    box-shadow: 0 1px 6px rgba(0,0,0,0.25);
  }

  /* スワイプトラック */
  .swipe-track {
    display: flex !important;
    overflow-x: auto !important;
    scroll-snap-type: x mandatory !important;
    scroll-behavior: smooth !important;
    -webkit-overflow-scrolling: touch !important;
    scrollbar-width: none !important;
    width: 100% !important;
    box-sizing: border-box !important;
  }
  .swipe-track::-webkit-scrollbar { display: none; }

  /* 各スライドペイン */
  .swipe-pane {
    flex: 0 0 100% !important;
    width: 100% !important;
    scroll-snap-align: start !important;
    box-sizing: border-box !important;
    padding: 10px 8px 30px !important;
    min-height: calc(100vh - 110px) !important;
  }

  #pane-top3 > #top3 {
    display: block !important;
  }
  .top3-box {
    width: 100% !important;
    box-sizing: border-box !important;
    padding: 8px !important;
    margin: 0 !important;
  }
  .top3-head {
    flex-direction: column !important;
    align-items: flex-start !important;
    gap: 2px !important;
  }
  .top3-sub {
    font-size: 9.5px !important;
    opacity: 0.8 !important;
  }
  .top3-grid {
    display: flex !important;
    flex-direction: column !important;
    gap: 8px !important;
  }
  .top3-card {

<script>
"use strict";
const SERVICES = [
  { key: "claude", name: "Claude Code", plan: "Claude Pro", url: "https://claude.ai/settings/usage",
    rcNote: "手入力のみ" },
  { key: "codex", name: "Codex", plan: "ChatGPT Plus", url: "https://chatgpt.com/codex/settings/usage", rcNote: "" },
];
const STALE_MIN = 30;
const ICONS = {
  claude: '<svg class="ico" viewBox="0 0 24 24" aria-label="Claude"><g stroke="#D97757" stroke-width="2.6" stroke-linecap="round">' +
    [0,30,60,90,120,150].map(a => '<line x1="12" y1="2.5" x2="12" y2="21.5" transform="rotate(' + a + ' 12 12)"/>').join("") + '</g></svg>',
  codex: '<svg class="ico" viewBox="0 0 24 24" aria-label="Codex"><rect x="1" y="1" width="22" height="22" rx="6" fill="#111"/><path d="M6.5 8l4 4-4 4" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><line x1="12.5" y1="16.5" x2="17.5" y2="16.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>',
  grok: '<svg class="ico" viewBox="0 0 24 24" aria-label="Grok Bot"><rect x="1" y="1" width="22" height="22" rx="6" fill="#111"/><path d="M7 17L17 7M9.5 7.5h-2v2M14.5 16.5h2v-2" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  antigravity: '<svg class="ico" viewBox="0 0 24 24" aria-label="Antigravity"><rect x="1" y="1" width="22" height="22" rx="6" fill="#2563eb"/><path d="M12 4.5l6.5 14h-2.8l-1.4-3.2H9.7l-1.4 3.2H5.5L12 4.5zm0 5.1l-1.5 3.6h3L12 9.6z" fill="#fff"/></svg>',
};
const GROK_NOTE = "自動取得できません（公式APIなし）。Grok Bot アプリの設定「Usage & Billing」で確認してください（表示されないアカウントもあります）。";
const NA = "不明";
const LS_KEY = (k) => "aiusage.manual." + k;
function isShow5h() { try { return localStorage.getItem("aiusage.show5h") !== "0"; } catch { return true; } }
function setShow5h(on) { try { localStorage.setItem("aiusage.show5h", on ? "1" : "0"); } catch {} render(); }
let DATA = null;

const fmtDate = new Intl.DateTimeFormat("ja-JP", { timeZone: "Asia/Tokyo", month: "numeric", day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit" });
const fmt = (d) => d ? fmtDate.format(d) : NA;
const toDate = (v) => { if (!v) return null; const d = new Date(v); return isNaN(d) ? null : d; };
const num = (v) => (typeof v === "boolean" || v === null || v === undefined || v === "" || !Number.isFinite(Number(v))) ? null : Number(v);

function countdown(d) {
  if (!d) return "";
  let s = Math.floor((d - Date.now()) / 1000);
  if (s <= 0) return "リセット済み";
  const day = Math.floor(s / 86400); s -= day * 86400;
  const h = Math.floor(s / 3600); s -= h * 3600;
  const m = Math.floor(s / 60);
  return "あと" + (day ? day + "日" : "") + (day || h ? h + "時間" : "") + m + "分";
}
function ago(d) {
  const m = Math.floor((Date.now() - d) / 60000);
  if (m < 1) return "1分以内";
  if (m < 60) return m + "分前";
  const h = Math.floor(m / 60);
  return h < 48 ? h + "時間" + (m % 60) + "分前" : Math.floor(h / 24) + "日前";
}
function loadManual(k) { try { return JSON.parse(localStorage.getItem(LS_KEY(k)) || "null"); } catch { return null; } }
function saveManual(k, v) { if (v) localStorage.setItem(LS_KEY(k), JSON.stringify(v)); else localStorage.removeItem(LS_KEY(k)); }
function getPath(o, p) { return p.split(".").reduce((a, k) => (a == null ? undefined : a[k]), o); }
function setPath(o, p, v) { const ks = p.split("."); let a = o; ks.slice(0, -1).forEach(k => { a[k] = a[k] || {}; a = a[k]; }); a[ks[ks.length - 1]] = v; }
function toLocalInput(v) { const d = toDate(v); if (!d) return ""; const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 16); }

// 表示値を決める: 手入力値が自動取得値より新しい（または自動取得値が無い）場合は手入力値
function pick(auto, man, manSavedAt, autoAsOf) {
  const autoOk = auto !== null && auto !== undefined;
  const manOk = man !== null && man !== undefined && man !== "";
  if (manOk && (!autoOk || !autoAsOf || (manSavedAt && manSavedAt > autoAsOf))) return { v: man, manual: true };
  if (autoOk) return { v: auto, manual: false };
  return { v: null, manual: false };
}

// 残量の色。今日の枠は週リセット時刻と週使用率から計算する。
function remColor(rem) {
  if (rem === null || rem === undefined) return "var(--muted)";
  if (rem >= 50) return "var(--ok)";
  if (rem >= 20) return "var(--warn)";
  return "var(--bad)";
}

function weeklyColor(tr, rem) {
  if (rem === null || rem === undefined) return "var(--track)";
  if (!tr || tr.unknown) return rem >= 50 ? "#3b82f6" : rem >= 20 ? "#eab308" : "#ef4444";
  const pct = tr.shown != null ? tr.shown : 0;
  if (pct >= 50) return "#3b82f6"; // 青色（今日の分が50%以上）
  if (pct > 0) return "#eab308";  // 黄色（今日の分が50%未満）
  return "#ef4444";               // 赤色（今日の枠を使い切り）
}

function todayRemain(fiveAuto, fiveMan, weekAuto, weekMan, manSavedAt, autoAsOf, dayTrack, now = Date.now()) {
  const wu = pick(num(weekAuto && weekAuto.used_percent), num(weekMan && weekMan.used_percent), manSavedAt, autoAsOf);
  const wr = pick(weekAuto && weekAuto.resets_at, weekMan && weekMan.resets_at, manSavedAt, autoAsOf);
  const reset = toDate(wr.v);
  if (wu.v === null || wu.v < 0 || wu.v > 100 || !reset) return {unknown:true};
  const start = reset.getTime() - 7 * 86400000;
  if (now < start || now >= reset.getTime()) return {unknown:true};
  const day = Math.floor((now - start) / 86400000) + 1;
  const weekAllowed = day * 100 / 7;
  const remainToday = Math.max(0, weekAllowed - wu.v);
  const shown = Math.round(remainToday * 7 * 10) / 10;
  return {unknown:false,noQuota:false,shown,day,weekAllowed,remainToday,
    carry:shown > 100,color:remColor(shown),nextDay:new Date(Math.min(reset.getTime(),start+day*86400000))};
}
function todayLine(tr) {
  return tr.unknown ? "今日使える分 不明" : "週"+tr.day+"日目・累積上限"+tr.weekAllowed.toFixed(1)+"%・残り"+tr.remainToday.toFixed(1)+"%（週全体比） / 1日分=100/7%"+(tr.carry ? "・持ち越しあり（バー上限100%）" : "");
}
function dailyWindowRow(tr) {
  const row=document.createElement("div"); row.className="row";
  row.innerHTML='<div class="row-head"><span class="label">今日使える分</span><span class="val"></span></div><div class="batt"><div class="fill"></div><div class="bt"></div></div><div class="reset">日次加算 <span class="rt"></span> <span class="countdown"></span></div>';
  const batt=row.querySelector('.batt'); batt.style.setProperty('--c',tr.unknown?'var(--track)':tr.color);
  batt.querySelector('.fill').style.width=(tr.unknown?0:Math.min(100,tr.shown))+'%';
  batt.querySelector('.bt').textContent=tr.unknown?'不明':'残り '+tr.shown+'%'+(tr.carry?' 持越':'');
  if(tr.unknown)batt.classList.add('na-ring');
  row.querySelector('.rt').textContent=fmt(tr.nextDay||null);
  if(tr.nextDay){const cd=row.querySelector('.countdown');cd.dataset.t=tr.nextDay.toISOString();cd.textContent=countdown(tr.nextDay)}
  return row;
}

function windowRow(label, autoW, manW, manSavedAt, autoAsOf, pacePct, isWeekly, tr) {
  const p = pick(num(autoW && autoW.used_percent), num(manW && manW.used_percent), manSavedAt, autoAsOf);
  const r = pick(autoW && autoW.resets_at, manW && manW.resets_at, manSavedAt, autoAsOf);
  const row = document.createElement("div"); row.className = "row";
  const used = p.v;
  const resetDate = toDate(r.v);
  const rem = used === null || used < 0 || used > 100 || (resetDate && Date.now() >= resetDate.getTime()) ? null : 100 - used;
  const color = isWeekly ? weeklyColor(tr, rem) : (rem === null ? "var(--track)" : rem >= 50 ? "#3b82f6" : rem >= 20 ? "#eab308" : "#ef4444");
  const d = toDate(r.v);
  row.innerHTML =
    '<div class="row-head"><span class="label"></span><span class="val"></span></div>' +
    '<div class="batt"><div class="fill"></div><div class="bt"></div></div>' +
    '<div class="reset">↻ <span class="rt"></span> <span class="countdown" data-t=""></span></div>';
  row.querySelector(".label").textContent = label;
  const dn = row.querySelector(".batt"), dv = row.querySelector(".bt");
  dn.style.setProperty("--c", color);
  dn.querySelector(".fill").style.width = (rem === null ? 0 : rem) + "%";
  if (isWeekly) {
    for (let _di = 1; _di <= 6; _di++) { const _t = document.createElement("div"); _t.className = "day-tick"; _t.style.left = (_di * 100 / 7) + "%"; dn.appendChild(_t); }
  }
  if (pacePct != null && !isNaN(pacePct)) {
    const mark = document.createElement("div"); mark.className = "pace-mark";
    mark.style.left = Math.min(100, Math.max(0, pacePct)) + "%";
    mark.title = "今日の累積利用上限 " + (Math.round((100-pacePct)*10)/10) + "%（残り " + (Math.round(pacePct*10)/10) + "% が境界）";
    dn.appendChild(mark);
  }
  if (rem === null) { dn.classList.add("na-ring"); dv.textContent = "不明"; }
  else { dv.textContent = "残り " + (Math.round(rem * 10) / 10) + "%"; }
  if (p.manual) row.querySelector(".val").insertAdjacentHTML("beforeend", '<span class="badge">手入力</span>');
  row.querySelector(".rt").textContent = fmt(d);
  if (r.manual && d) row.querySelector(".rt").insertAdjacentHTML("afterend", '<span class="badge">手入力</span>');
  const cd = row.querySelector(".countdown");
  if (d) { cd.dataset.t = d.toISOString(); cd.textContent = countdown(d); }
  return row;
}

function fmtTok(n) {
  if (!n || n <= 0) return "0";
  if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (n >= 1e3) return Math.round(n / 1e3) + "k";
  return String(n);
}
function agyModelColor(name) {
  const s = String(name || "");
  if (s.includes("Claude")) return "#d97757";
  if (s.includes("Argon") || s.includes("Pro")) return "#8b5cf6";
  if (s.includes("Gemini")) return "#3b82f6";
  return "#64748b";
}
function renderAntigravity(strip, det, wrap) {
  const agy = (DATA && DATA.services && DATA.services.antigravity) || null;
  const models = (agy && Array.isArray(agy.models) && agy.models.length) ? agy.models : [];
  const totals = (agy && agy.totals) || {};
  const tDay = totals.today || {}, tWk = totals.weekly || {};
  const asOf = (agy && toDate(agy.as_of)) || (DATA && toDate(DATA.fetched_at));

  const st = document.createElement("div");
  st.className = "agy-strip";
  const head = document.createElement("div");
  head.className = "agy-head";
  head.title = "Antigravity 利用枠（タップで詳細）";
  head.innerHTML = '<span class="agy-title">' + ICONS.antigravity + '<span>Antigravity</span></span>';
  if (agy && agy.current_model) {
    const cur = document.createElement("span");
    cur.className = "agy-cur";
    cur.textContent = "現在: " + agy.current_model;
    head.appendChild(cur);
  }
  const sum = document.createElement("span");
  sum.className = "agy-sum";
  sum.textContent = (tDay.steps || tWk.steps)
    ? "今日 " + (tDay.prompts || 0) + "回/" + (tDay.steps || 0) + "s (" + fmtTok(tDay.total_tokens) + ") · 1週 " + (tWk.prompts || 0) + "回/" + (tWk.steps || 0) + "s (" + fmtTok(tWk.total_tokens) + ")"
    : (asOf ? "取得 " + fmt(asOf) : "");
  head.appendChild(sum);
  head.addEventListener("click", () => setExpanded(!document.body.classList.contains("expanded")));
  st.appendChild(head);

  const mGrid = document.createElement("div");
  mGrid.className = "agy-models-strip";

  const dsv = document.createElement("div");
  dsv.className = "dsv";
  dsv.innerHTML = ICONS.antigravity + "<div></div>";
  const dbox = dsv.lastChild;
  const dlHead = document.createElement("div");
  dlHead.className = "dl";
  dlHead.innerHTML = '<span class="k">Antigravity（公式 agy /usage 取得）</span> ' + (agy && agy.current_model ? "現在: " + agy.current_model : "");
  dbox.appendChild(dlHead);

  const cardsWrap = document.createElement("div");
  cardsWrap.className = "agy-cards-wrap";

  models.forEach(m => {
    const mKey = m.key || ("agy_" + String(m.name).toLowerCase().replace(/[^a-z0-9]+/g, "_"));
    const man = loadManual(mKey);
    const manSavedAt = man && man.saved_at ? new Date(man.saved_at) : null;
    const col = agyModelColor(m.name);
    const tr = todayRemain(m.five_hour, man && man.five_hour, m.weekly, man && man.weekly, manSavedAt, asOf, m.day_track);
    const has5h = (m.five_hour && num(m.five_hour.used_percent) !== null) || (man && man.five_hour && num(man.five_hour.used_percent) !== null);
    const hasWk = (m.weekly && num(m.weekly.used_percent) !== null) || (man && man.weekly && num(man.weekly.used_percent) !== null);

    // フルカード (#cards) を先に組んで、そのバッテリーバーから #strip / #det も生成（Claude/Codex と完全統一）
    const card = document.createElement("section");
    card.className = "card";
    card.innerHTML =
      '<div class="card-head"><h2 class="name"></h2><span class="plan">Antigravity</span></div>' +
      '<div class="rows"></div>' +
      '<div class="src"></div>' +
      '<div class="actions"><button type="button" class="open-manual">✎ 手入力</button></div>';
    card.querySelector(".name").textContent = m.name;
    const cRows = card.querySelector(".rows");
    const show5h = isShow5h();
    const wins = [
      { sl: "今日", row: dailyWindowRow(tr), pace: null },
      { sl: "1w", row: windowRow("1週間", m.weekly, man && man.weekly, manSavedAt, asOf, tr.unknown ? null : 100 - tr.weekAllowed, true, tr), pace: tr.unknown ? null : 100 - tr.weekAllowed }
    ];
    if (show5h && (has5h || !hasWk)) {
      wins.push({ sl: "5h", row: windowRow("5時間枠", m.five_hour, man && man.five_hour, manSavedAt, asOf, null, false), pace: null });
    }
    wins.forEach(({ row }) => cRows.appendChild(row));

    // Compact #strip カラム
    const mCol = document.createElement("div");
    mCol.className = "agy-mcol";
    mCol.title = m.name + "（タップで詳細）";
    const mTop = document.createElement("div");
    mTop.className = "agy-mcol-head";
    mTop.innerHTML = '<span class="agy-mname" style="--c:' + col + '"><span class="agy-dot"></span><span></span></span>';
    mTop.querySelector(".agy-mname span:last-child").textContent = m.name;
    mCol.appendChild(mTop);

    const gBars = document.createElement("div");
    gBars.className = "mg-bars";
    const dlModel = document.createElement("div");
    dlModel.className = "dl";
    dlModel.innerHTML = '<span class="k"></span> ' + todayLine(tr);
    dlModel.querySelector(".k").textContent = "【" + m.name + "】";
    dbox.appendChild(dlModel);

    wins.forEach(({ sl, row, pace, no5h }) => {
      const src = row.querySelector(".batt"), t = src.querySelector(".bt").textContent, na = !t.startsWith("残り");
      const mb = document.createElement("span");
      mb.className = "mb" + (na ? " na-ring" : "");
      mb.style.setProperty("--c", src.style.getPropertyValue("--c"));
      mb.innerHTML = '<div class="fill"></div>';
      mb.firstChild.style.width = src.querySelector(".fill").style.width;
      if (sl === "1w") {
        for (let _di = 1; _di <= 6; _di++) {
          const _t = document.createElement("div");
          _t.className = "day-tick";
          _t.style.left = (_di * 100 / 7) + "%";
          mb.appendChild(_t);
        }
      }
      if (pace != null && !isNaN(pace)) {
        const mark = document.createElement("div");
        mark.className = "pace-mark";
        mark.style.left = Math.min(100, Math.max(0, pace)) + "%";
        mb.appendChild(mark);
      }
      const wl = document.createElement("span");
      wl.className = "wl";
      wl.textContent = sl;
      const mp = document.createElement("span");
      mp.className = "mp" + (na ? " na" : "");
      mp.textContent = no5h ? "週枠のみ" : (na ? "不明" : t.replace("残り ", ""));
      gBars.append(wl, mb, mp);

      const cd = row.querySelector(".countdown");
      const rt = row.querySelector(".rt");
      const l = document.createElement("div");
      l.className = "dl";
      l.innerHTML = '<span class="k"></span> ↻ <span class="rt"></span> <span class="countdown"></span>';
      l.querySelector(".k").textContent = "  " + sl + " " + (no5h ? "週枠のみ" : (na ? "不明" : t.replace("残り ", "")));

function initSwipeTabs() {
  const tabs = document.querySelectorAll(".stab");
  const track = document.getElementById("swipe-track");
  const panes = document.querySelectorAll(".swipe-pane");
  if (!track || !tabs.length || !panes.length) return;

  tabs.forEach((tab, idx) => {
    tab.onclick = () => {
      const pane = panes[idx];
      if (pane) {
        track.scrollTo({ left: pane.offsetLeft, behavior: "smooth" });
        tabs.forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
      }
    };
  });

  // スワイプ時のタブ自動連動
  let isScrolling = null;
  track.onscroll = () => {
    clearTimeout(isScrolling);
    isScrolling = setTimeout(() => {
      const scrollLeft = track.scrollLeft;
      const width = track.clientWidth || 1;
      const curIdx = Math.round(scrollLeft / width);
      tabs.forEach((t, i) => {
        t.classList.toggle("active", i === curIdx);
      });
      const activeTab = tabs[curIdx];
      if (activeTab && activeTab.scrollIntoView) {
        activeTab.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
      }
    }, 40);
  };

  // URLハッシュによる初期タブ指定対応 (#claude 等)
  const hash = location.hash.replace('#', '');
  if (hash === 'claude') tabs[1]?.click();
  else if (hash === 'codex') tabs[2]?.click();
  else if (hash === 'antigravity') tabs[3]?.click();
}

  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
}
function closeManual() { if (dlg.close) dlg.close(); else dlg.removeAttribute("open"); }
dlg.querySelector(".close").addEventListener("click", closeManual);
dlg.querySelector(".save").addEventListener("click", () => {
  if (!CUR) return;
  const o = {}; let any = false;
  dlg.querySelectorAll("input[data-k]").forEach(inp => {
    if (inp.value === "") return;
    let val = inp.value;
    if (inp.type === "datetime-local") { const d = new Date(val); if (isNaN(d)) return; val = d.toISOString(); }
    else { val = Number(val); if (isNaN(val)) return; }
    setPath(o, inp.dataset.k, val); any = true;
  });
  if (any) o.saved_at = new Date().toISOString();
  saveManual(CUR.key, any ? o : null);
  closeManual(); render();
});
dlg.querySelector(".clear").addEventListener("click", () => {
  if (CUR && confirm(CUR.name + " の手入力値を消去しますか？")) { saveManual(CUR.key, null); closeManual(); render(); }
});

function updateMeta() {
  const el = document.getElementById("fetched");
  const badge = document.getElementById("stale");
  const f = DATA && toDate(DATA.fetched_at);
  if (!f) {
    el.textContent = "最終取得: " + NA;
    badge.hidden = false; badge.textContent = "⚠ データ読込失敗";
    badge.title = "data/usage.json を読み込めませんでした。";
    return;
  }
  el.textContent = fmt(f) + "（" + ago(f) + "）"; el.title = "最終取得 " + fmt(f);
  const mt = document.getElementById("mtime"); if (mt) { mt.textContent = fmt(f).replace(/^.*?\) ?/, "") + ((Date.now() - f) / 60000 > STALE_MIN ? " ⚠" : ""); mt.title = "最終取得 " + fmt(f) + "（" + ago(f) + "）"; }
  badge.hidden = (Date.now() - f) / 60000 <= STALE_MIN;
  badge.textContent = "⚠ 古い";
  badge.title = ago(f) + "に取得。更新は PC で Claude Code / Codex を使ったときだけ行われます（スマホでの利用分は未反映の可能性）。";
}

let BASE_H = null;
function setExpanded(on, quiet) {
  document.body.classList.toggle("expanded", on);
  const t = document.getElementById("mtoggle"); if (t) { t.textContent = on ? "詳細 ▲" : "詳細 ▼"; t.setAttribute("aria-expanded", on); }
  if (quiet) return;
  // Edge/Chrome の --app ウィンドウでは内容に合わせて高さを変える（スマホでは無視される）
  try {
    if (window.innerWidth < 700 && !/Mobi|Android|iPhone/.test(navigator.userAgent)) {
      const chrome = window.outerHeight - window.innerHeight;
      requestAnimationFrame(() => {
        const need = Math.ceil(document.querySelector("main").getBoundingClientRect().bottom + 10);
        if (on) { if (BASE_H === null) BASE_H = window.outerHeight; if (need > window.innerHeight) window.resizeTo(window.outerWidth, need + chrome); }
        else if (BASE_H !== null) { window.resizeTo(window.outerWidth, BASE_H); BASE_H = null; }
      });
    }
  } catch (e) {}
}

function tick() {
  document.querySelectorAll(".countdown[data-t]").forEach(el => {
    if (el.dataset.t) el.textContent = countdown(new Date(el.dataset.t));
  });
  updateMeta();
}

function loadLocalData() {
  return new Promise((resolve,reject)=>{
    const script=document.createElement('script');
    window.AI_USAGE_LOCAL=undefined;
    script.src='data/usage-local.js?ts='+Date.now();
    script.onload=()=>{const payload=window.AI_USAGE_LOCAL;script.remove();if(payload&&payload.services)resolve(payload);else reject(new Error('ローカルデータ不明'))};
    script.onerror=()=>{script.remove();reject(new Error('ウィジェットを再起動してローカルデータを更新してください'))};
    document.head.appendChild(script);
  });
}
async function load() {
  try {
    if(location.protocol==='file:') DATA=await loadLocalData();
    else {
      const res=await fetch('data/usage.json?ts='+Date.now(),{cache:'no-store'});
      if(!res.ok)throw new Error('HTTP '+res.status);
      DATA=await res.json();
    }
  } catch(e) {
    console.warn(e);
    if(!DATA)DATA=null;
  }
  render();
}

document.getElementById("reload").addEventListener("click", load);
const _htoggle = document.getElementById("htoggle");
if (_htoggle) _htoggle.addEventListener("click", () => setExpanded(!document.body.classList.contains("expanded")));
const _hshow5h = document.getElementById("hshow5h");
if (_hshow5h) _hshow5h.addEventListener("change", e => setShow5h(e.target.checked));
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
if (location.hash === "#compact") document.body.classList.remove("expanded");
else document.body.classList.add("expanded");
setInterval(tick, 15000);
setInterval(load, 5 * 60000);
load();
</script>
</body>
</html>
