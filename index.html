<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI使用量">
<title>AI使用量ダッシュボード</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7; --card: #ffffff; --text: #1b1d22; --muted: #6b7280; --line: #e5e7eb;
    --track: #e9ebef; --ok: #16a34a; --warn: #d97706; --bad: #dc2626; --accent: #2563eb;
    --manual: #7c3aed; --banner: #fff7ed; --banner-text: #9a3412;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318; --card: #1b1e25; --text: #e8eaf0; --muted: #9aa1ae; --line: #2b2f39;
      --track: #2b2f39; --ok: #22c55e; --warn: #f59e0b; --bad: #f87171; --accent: #60a5fa;
      --manual: #a78bfa; --banner: #3a2410; --banner-text: #fdba74;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
    font-size: 15px; line-height: 1.5; -webkit-text-size-adjust: 100%;
    padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  }
  main { max-width: 560px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 2px 10px; }
  h1 { font-size: 19px; margin: 0; }
  .meta { color: var(--muted); font-size: 13px; margin: 0 2px 10px; }
  button, .btn {
    font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 10px; padding: 8px 12px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
  }
  button:active, .btn:active { opacity: .7; }
  .btn.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  .banner { background: var(--banner); color: var(--banner-text); border-radius: 12px; padding: 10px 12px; margin: 0 0 12px; font-size: 14px; }
  .banner[hidden] { display: none; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin: 0 0 14px; }
  .card h2 { font-size: 17px; margin: 0; }
  .card .plan { color: var(--muted); font-size: 13px; font-weight: normal; margin-left: 6px; }
  .row { padding: 10px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .row-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .label { font-size: 14px; color: var(--muted); }
  .pct { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .pct small { font-size: 15px; font-weight: 600; }
  .na { font-size: 16px; font-weight: 600; color: var(--muted); }
  .bar { height: 10px; background: var(--track); border-radius: 999px; overflow: hidden; margin: 6px 0 6px; }
  .bar > span { display: block; height: 100%; width: 0; border-radius: 999px; background: var(--ok); transition: width .4s; }
  .bar.warn > span { background: var(--warn); } .bar.bad > span { background: var(--bad); }
  .reset { font-size: 14px; font-variant-numeric: tabular-nums; }
  .countdown { font-weight: 600; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--manual); color: var(--manual); margin-left: 6px; vertical-align: middle; }
  .src { color: var(--muted); font-size: 12px; margin-top: 8px; word-break: break-word; }
  .err { color: var(--bad); font-size: 12px; margin-top: 4px; word-break: break-word; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  details { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; }
  summary { cursor: pointer; color: var(--manual); font-size: 14px; font-weight: 600; }
  .form { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 8px; }
  .form label { font-size: 13px; color: var(--muted); display: grid; gap: 3px; }
  .form input { font: inherit; font-size: 16px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); width: 100%; }
  .hint { font-size: 12px; color: var(--muted); }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>AI使用量</h1>
    <button id="reload" type="button" aria-label="再読み込み">↻ 更新</button>
  </header>
  <p class="meta" id="fetched">最終取得: 読み込み中…</p>
  <div class="banner" id="stale" hidden></div>
  <div id="cards"></div>
  <footer>
    自動取得: PCのコレクターが約15分ごとに更新 ／ 「手入力」の値はこの端末のブラウザにだけ保存されます
  </footer>
</main>

<template id="card-tpl">
  <section class="card">
    <h2><span class="name"></span><span class="plan"></span></h2>
    <div class="rows"></div>
    <div class="src"></div>
    <div class="err"></div>
    <div class="actions"><a class="btn primary official" target="_blank" rel="noopener">公式の使用量ページ ↗</a></div>
    <details>
      <summary>手入力（上書き・補完）</summary>
      <div class="form">
        <p class="hint">公式ページ等で確認した値を入力できます。自動取得値より新しい手入力値がある場合は手入力値を表示し「手入力」と表示します。空欄は未入力扱いです。</p>
        <label>5時間枠 使用率 (%) <input type="number" inputmode="decimal" min="0" max="100" step="0.1" data-k="five_hour.used_percent"></label>
        <label>5時間枠 リセット日時 <input type="datetime-local" data-k="five_hour.resets_at"></label>
        <label>週間枠 使用率 (%) <input type="number" inputmode="decimal" min="0" max="100" step="0.1" data-k="weekly.used_percent"></label>
        <label>週間枠 リセット日時 <input type="datetime-local" data-k="weekly.resets_at"></label>
        <label><span class="rc-label">リセット回数</span> <input type="number" inputmode="numeric" min="0" step="1" data-k="reset_count"></label>
        <div class="actions">
          <button type="button" class="save">手入力を保存</button>
          <button type="button" class="clear">手入力を消去</button>
        </div>
        <p class="hint saved-at"></p>
      </div>
    </details>
  </section>
</template>

<script>
"use strict";
const SERVICES = [
  { key: "claude", name: "Claude Code", plan: "Claude Pro", url: "https://claude.ai/settings/usage",
    rcNote: "Claude のリセット回数は自動取得できないため手入力のみです" },
  { key: "codex", name: "Codex", plan: "ChatGPT Plus", url: "https://chatgpt.com/codex/settings/usage", rcNote: "" },
];
const STALE_MIN = 30;
const NA = "取得できません";
const LS_KEY = (k) => "aiusage.manual." + k;
let DATA = null;

const fmtDate = new Intl.DateTimeFormat("ja-JP", { timeZone: "Asia/Tokyo", month: "numeric", day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit" });
const fmt = (d) => d ? fmtDate.format(d) : NA;
const toDate = (v) => { if (!v) return null; const d = new Date(v); return isNaN(d) ? null : d; };
const num = (v) => (v === null || v === undefined || v === "" || isNaN(Number(v))) ? null : Number(v);

function countdown(d) {
  if (!d) return "";
  let s = Math.floor((d - Date.now()) / 1000);
  if (s <= 0) return "リセット時刻を過ぎました";
  const day = Math.floor(s / 86400); s -= day * 86400;
  const h = Math.floor(s / 3600); s -= h * 3600;
  const m = Math.floor(s / 60);
  return "あと " + (day ? day + "日" : "") + (day || h ? h + "時間" : "") + m + "分";
}
function ago(d) {
  const m = Math.floor((Date.now() - d) / 60000);
  if (m < 1) return "1分以内";
  if (m < 60) return m + "分前";
  const h = Math.floor(m / 60);
  return h < 48 ? h + "時間" + (m % 60) + "分前" : Math.floor(h / 24) + "日前";
}
function loadManual(k) { try { return JSON.parse(localStorage.getItem(LS_KEY(k)) || "null"); } catch { return null; } }
function saveManual(k, v) { if (v) localStorage.setItem(LS_KEY(k), JSON.stringify(v)); else localStorage.removeItem(LS_KEY(k)); }
function getPath(o, p) { return p.split(".").reduce((a, k) => (a == null ? undefined : a[k]), o); }
function setPath(o, p, v) { const ks = p.split("."); let a = o; ks.slice(0, -1).forEach(k => { a[k] = a[k] || {}; a = a[k]; }); a[ks[ks.length - 1]] = v; }
function toLocalInput(v) { const d = toDate(v); if (!d) return ""; const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 16); }

// 表示値を決める: 手入力値が自動取得値より新しい（または自動取得値が無い）場合は手入力値
function pick(auto, man, manSavedAt, autoAsOf) {
  const autoOk = auto !== null && auto !== undefined;
  const manOk = man !== null && man !== undefined && man !== "";
  if (manOk && (!autoOk || !autoAsOf || (manSavedAt && manSavedAt > autoAsOf))) return { v: man, manual: true };
  if (autoOk) return { v: auto, manual: false };
  return { v: null, manual: false };
}

function windowRow(label, autoW, manW, manSavedAt, autoAsOf) {
  const p = pick(num(autoW && autoW.used_percent), num(manW && manW.used_percent), manSavedAt, autoAsOf);
  const r = pick(autoW && autoW.resets_at, manW && manW.resets_at, manSavedAt, autoAsOf);
  const row = document.createElement("div"); row.className = "row";
  const pct = p.v;
  const cls = pct === null ? "" : pct >= 90 ? "bad" : pct >= 70 ? "warn" : "";
  const d = toDate(r.v);
  row.innerHTML =
    '<div class="row-head"><span class="label"></span><span class="val"></span></div>' +
    '<div class="bar ' + cls + '"><span></span></div>' +
    '<div class="reset">リセット: <span class="rt"></span> <span class="countdown" data-t=""></span></div>';
  row.querySelector(".label").textContent = label;
  const val = row.querySelector(".val");
  if (pct === null) { val.innerHTML = '<span class="na"></span>'; val.firstChild.textContent = NA; }
  else { val.innerHTML = '<span class="pct"></span>'; val.firstChild.innerHTML = (Math.round(pct * 10) / 10) + "<small>% 使用</small>"; }
  if (p.manual) val.insertAdjacentHTML("beforeend", '<span class="badge">手入力</span>');
  row.querySelector(".bar > span").style.width = (pct === null ? 0 : Math.min(100, Math.max(0, pct))) + "%";
  row.querySelector(".rt").textContent = fmt(d);
  if (r.manual && d) row.querySelector(".rt").insertAdjacentHTML("afterend", '<span class="badge">手入力</span>');
  const cd = row.querySelector(".countdown");
  if (d) { cd.dataset.t = d.toISOString(); cd.textContent = "（" + countdown(d) + "）"; }
  return row;
}

function render() {
  const wrap = document.getElementById("cards");
  wrap.textContent = "";
  const tpl = document.getElementById("card-tpl");
  SERVICES.forEach(s => {
    const node = tpl.content.firstElementChild.cloneNode(true);
    const auto = (DATA && DATA.services && DATA.services[s.key]) || {};
    const man = loadManual(s.key);
    const manSavedAt = man && man.saved_at ? new Date(man.saved_at) : null;
    const autoAsOf = toDate(auto.as_of) || toDate(DATA && DATA.fetched_at);
    node.querySelector(".name").textContent = s.name;
    node.querySelector(".plan").textContent = s.plan;
    const rows = node.querySelector(".rows");
    rows.appendChild(windowRow("5時間枠", auto.five_hour, man && man.five_hour, manSavedAt, autoAsOf));
    rows.appendChild(windowRow("週間枠", auto.weekly, man && man.weekly, manSavedAt, autoAsOf));

    // リセット回数
    const rc = pick(num(auto.reset_count), num(man && man.reset_count), manSavedAt, autoAsOf);
    const rr = document.createElement("div"); rr.className = "row";
    rr.innerHTML = '<div class="row-head"><span class="label">リセット回数（残り）</span><span class="val"></span></div><div class="sub"></div>';
    const v = rr.querySelector(".val");
    if (rc.v === null) { v.innerHTML = '<span class="na"></span>'; v.firstChild.textContent = NA; }
    else { v.innerHTML = '<span class="pct"></span>'; v.firstChild.innerHTML = rc.v + "<small> 回</small>"; }
    if (rc.manual) v.insertAdjacentHTML("beforeend", '<span class="badge">手入力</span>');
    const subs = [];
    if (!rc.manual && auto.reset_count_expires_at) subs.push("最も早い有効期限: " + fmt(toDate(auto.reset_count_expires_at)));
    if (s.rcNote) subs.push(s.rcNote);
    rr.querySelector(".sub").textContent = subs.join(" ／ ");
    rows.appendChild(rr);

    const src = [];
    if (auto.source) src.push("取得元: " + auto.source);
    if (auto.as_of) { const a = toDate(auto.as_of); if (a) src.push("値の時点: " + fmt(a) + "（" + ago(a) + "）"); }
    if (manSavedAt) src.push("手入力保存: " + fmt(manSavedAt));
    node.querySelector(".src").textContent = src.join(" ／ ");
    node.querySelector(".err").textContent = auto.error ? "⚠ " + auto.error : "";
    node.querySelector(".official").href = s.url;

    // 手入力フォーム
    node.querySelectorAll("input[data-k]").forEach(inp => {
      const val = man ? getPath(man, inp.dataset.k) : null;
      inp.value = val == null ? "" : (inp.type === "datetime-local" ? toLocalInput(val) : val);
    });
    if (s.key === "claude") node.querySelector(".rc-label").textContent = "リセット回数（Claude は手入力のみ）";
    node.querySelector(".saved-at").textContent = manSavedAt ? "保存日時: " + fmt(manSavedAt) : "未保存";
    node.querySelector(".save").addEventListener("click", () => {
      const o = {}; let any = false;
      node.querySelectorAll("input[data-k]").forEach(inp => {
        if (inp.value === "") return;
        let val = inp.value;
        if (inp.type === "datetime-local") { const d = new Date(val); if (isNaN(d)) return; val = d.toISOString(); }
        else { val = Number(val); if (isNaN(val)) return; }
        setPath(o, inp.dataset.k, val); any = true;
      });
      if (any) o.saved_at = new Date().toISOString();
      saveManual(s.key, any ? o : null);
      render();
    });
    node.querySelector(".clear").addEventListener("click", () => {
      if (confirm(s.name + " の手入力値を消去しますか？")) { saveManual(s.key, null); render(); }
    });
    if (man) node.querySelector("details").open = false;
    wrap.appendChild(node);
  });
  updateMeta();
}

function updateMeta() {
  const el = document.getElementById("fetched");
  const banner = document.getElementById("stale");
  const f = DATA && toDate(DATA.fetched_at);
  if (!f) {
    el.textContent = "最終取得: " + NA;
    banner.hidden = false;
    banner.textContent = "データ（data/usage.json）を読み込めませんでした。";
    return;
  }
  el.textContent = "最終取得: " + fmt(f) + "（" + ago(f) + "）";
  const staleMin = (Date.now() - f) / 60000;
  banner.hidden = staleMin <= STALE_MIN;
  banner.textContent = "⚠ データが古い可能性があります（" + ago(f) + "に取得）。PCが起動していない、またはコレクターが停止しているかもしれません。";
}

function tick() {
  document.querySelectorAll(".countdown[data-t]").forEach(el => {
    if (el.dataset.t) el.textContent = "（" + countdown(new Date(el.dataset.t)) + "）";
  });
  updateMeta();
}

async function load() {
  try {
    const res = await fetch("data/usage.json?ts=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    DATA = await res.json();
  } catch (e) {
    console.warn(e);
    if (!DATA) DATA = null;
  }
  render();
}

document.getElementById("reload").addEventListener("click", load);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
setInterval(tick, 15000);
setInterval(load, 5 * 60000);
load();
</script>
</body>
</html>
